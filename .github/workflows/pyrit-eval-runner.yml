name: pyrit-eval-runner CI

on:
  pull_request:
    branches: [ "*" ]
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel and sdist
        working-directory: pyrit-eval-runner
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyrit-eval-runner-dist
          path: pyrit-eval-runner/dist/*

